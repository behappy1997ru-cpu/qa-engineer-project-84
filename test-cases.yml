- summary: |
    Успешная смена языка интерфейса на русский
  requirement: |
    Пользователь должен иметь возможность переключить язык интерфейса
  environment:
    Windows NT 10.0; Win64; x64
    Chrome/154.0.0.0
  prerequisites:
    Открыта главная страница сайта  products-store.hexlet.app
    Язык интерфейса по умолчанию Анлгийский (English)
  steps:
    - шаг 1: В правом верхнем углу нажимаем "Language"
    - шаг 2: Выбираем Russian в открывшимся окне
  expected-result: |
    Язык интерфейса сменится на Русский
    Верстка полей не будет нарушена

- summary: |
    Успешная смена языка интерфейса на английский
  requirement: |
    Пользователь должен иметь возможность переключить язык интерфейса
  environment: >
    Mozilla/5.0 (Linux; Android 14; SM-A556B)
    AppleWebKit/537.36 (KHTML, like Gecko) 
    Chrome/156.0.0.0 Mobile Safari/537.36
  prerequisites:
    Открыта главная страница сайта  products-store.hexlet.app
    Язык интерфейса по умолчанию Анлгийский (English)
    В правом верхнем углу нажимаем "Language"
    Выбираем Russian в открывшимся окне
  steps:
    - шаг 1: В правом верхнем углу нажимаем "Язык"
    - шаг 2: Выбираем "Английский" в открывшимся окне
  expected-result: |
    Язык интерфейса сменится на Английский 
    Верстка полей не будет нарушена
    
