- summary: |
    Успешная смена языка интерфейса на русский
  requirement: |
    Пользователь должен иметь возможность переключить язык интерфейса
  environment:
    Windows NT 10.0; Win64; x64
    Chrome/154.0.0.0
  prerequisites:
    Открыта главная страница сайта  products-store.hexlet.app
    Язык интерфейса по умолчанию Анлгийский (English)
  steps:
    - шаг 1: В правом верхнем углу нажимаем "Language"
    - шаг 2: Выбираем Russian в открывшимся окне
  expected-result: |
    Язык интерфейса сменится на Русский
    Верстка полей не будет нарушена

- summary: |
    Успешная смена языка интерфейса на английский
  requirement: |
    Пользователь должен иметь возможность переключить язык интерфейса
  environment: >
    Mozilla/5.0 (Linux; Android 14; SM-A556B)
    AppleWebKit/537.36 (KHTML, like Gecko) 
    Chrome/156.0.0.0 Mobile Safari/537.36
  prerequisites:
    Открыта главная страница сайта  products-store.hexlet.app
    Язык интерфейса по умолчанию Анлгийский (English)
    В правом верхнем углу нажимаем "Language"
    Выбираем Russian в открывшимся окне
  steps:
    - шаг 1: В правом верхнем углу нажимаем "Язык"
    - шаг 2: Выбираем "Английский" в открывшимся окне
  expected-result: |
    Язык интерфейса сменится на Английский 
    Верстка полей не будет нарушена

    - summary: |
    Успешное добавление товаров в корзину
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины
  environment:
    Windows NT 10.0; Win64; x64
    Chrome/154.0.0.0
    язык интерфейса Русский
  test-data: |
   Milk - 27 шт.
   Nescafe Coffee  - 57 шт.
  prerequisites:
    Открыта главная страница сайта  products-store.hexlet.app
    В корзине 0 товаров
  steps:
    - шаг 1:  В поле Поиск вводим "Milk" 
    - шаг 2:  Нажимаем кнопку "В корзину" на карточке "Milk" 1 раз
    - шаг 3: Видим  что в правом верхнем углу у корзины изменилось значение на 1
    - шаг 4: В поле Поиск вводим "coffee" вместо  "Milk" 
    - шаг 5: Видим  что в правом верхнем углу у корзины изменилось значение на 2
    - шаг 3: Переходим  в корзину 
  expected-result: |
    - товар Milk отображается  с количеством 1 шт
    - товар Nescafe Coffee отображается  с количеством 1 шт

 - summary: |
   Добавление товара в корзину больше доступного в наличие
  requirement: |
    Пользователь должен иметь возможность добавлять товары в корзину и просматривать содержимое корзины
  environment:
    Windows NT 10.0; Win64; x64
    Chrome/154.0.0.0
  test-data: |
   Milk - 27 шт.
  prerequisites:
    Открыта главная страница сайта  products-store.hexlet.app
    В корзине 27 товаров Milk
  steps:
    - шаг 1:  Нажимаем кнопку "В корзину" на карточке "Milk" 1 раз
    - шаг 2: Видим  что в правом верхнем углу у корзины изменение не произошли 
    - шаг 3: Переходим  в корзину 
  expected-result: |
    - товар Milk отображается с количеством 27 шт 

  
    
